#
# Default model config for the fuzzing taskflow (this repository only).
#
# claude-sonnet-5 has empirically given the best harness-writing / triage
# results for this pipeline, so it is the default for every role here. Every
# taskflow YAML under seclab_taskflows_fuzzing.taskflows.fuzzing.* references
# this file directly (see its `model_config:` header), so running any stage
# via `python -m seclab_taskflow_agent -t seclab_taskflows_fuzzing.taskflows.fuzzing.<stage> ...`
# uses claude-sonnet-5 automatically — no `-m` flag or environment variable
# required.
#
# To use a different model for a one-off run, pass
# `-m <other_module_path>` explicitly; that still overrides this default.
#
# Both roles use the anthropic_sdk backend (Anthropic Messages API), which
# caches the system prompt and tool definitions across turns. code_analysis
# uses high reasoning effort; general_tasks (bookkeeping and reporting) uses
# low effort.

seclab-taskflow-agent:
  version: "1.0"
  filetype: model_config
models:
  code_analysis: claude-sonnet-5
  general_tasks: claude-sonnet-5
model_settings:
  code_analysis:
    api_type: messages
    backend: anthropic_sdk
    reasoning:
      effort: high
  general_tasks:
    api_type: messages
    backend: anthropic_sdk
    reasoning:
      effort: low
