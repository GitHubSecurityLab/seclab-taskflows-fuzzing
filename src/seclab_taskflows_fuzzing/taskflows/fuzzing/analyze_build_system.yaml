seclab-taskflow-agent:
  filetype: taskflow
  version: "1.0"
model_config: seclab_taskflows_fuzzing.configs.model_config

globals:
  repo:

# Determine how to build the repo with AFL++ instrumentation.
# Builds the target library three times (afl / cmplog / cov variants) so each
# harness binary links library code instrumented the same way as itself.
# Outputs:
#   - Notes (in fuzz_context.target.notes / harness.notes) on the build system,
#     library entry points, header paths, and link requirements per target.
#     Paths into the variant build dirs use the `{variant}` placeholder that
#     compile_harness substitutes per binary.
taskflow:
  - task:
      model: code_analysis
      must_complete: true
      max_steps: 100
      name: analyse build system
      description: Detect the repo's build system and build its library with AFL++ edge, AFL++ CMPLOG and clang coverage instrumentation.
      agents:
        - seclab_taskflows_fuzzing.personalities.fuzzing_engineer
      user_prompt: |
        For repo {{ globals.repo }}, determine the build system (CMake,
        autotools/configure, Meson, plain Makefile, single-file headers, etc.)
        and figure out how to produce a static library or object files we can
        link our fuzz harnesses against.

        Every harness is linked into three binaries, and the library code only
        gets coverage feedback, sanitizer checks, CMPLOG hooks or coverage
        mapping if it is compiled the same way as the binary it ends up in. So
        build the library THREE times, once per variant, each in its own build
        directory:

          - `afl`    → `CC=afl-clang-lto CXX=afl-clang-lto++ AR=llvm-ar RANLIB=llvm-ranlib
                        AFL_USE_ASAN=1 AFL_USE_UBSAN=1 CFLAGS="-g -O1" CXXFLAGS="-g -O1"`
          - `cmplog` → `CC=afl-clang-lto CXX=afl-clang-lto++ AR=llvm-ar RANLIB=llvm-ranlib
                        AFL_LLVM_CMPLOG=1 CFLAGS="-g -O1" CXXFLAGS="-g -O1"`.
                        Do NOT set any `AFL_USE_*` variable here, not even to
                        `0`: AFL++ enables a sanitizer when the variable merely
                        exists.
          - `cov`    → `CC=clang CXX=clang++` with
                        `CFLAGS` / `CXXFLAGS` / `LDFLAGS` =
                        `"-g -O1 -fprofile-instr-generate -fcoverage-mapping"`

        If `afl-clang-lto` is not on PATH (`command -v afl-clang-lto`), use
        `afl-clang-fast` / `afl-clang-fast++` instead for both the `afl` and
        `cmplog` variants, and say so in the target notes. `compile_harness`
        makes the same choice, so the harness and the library always match.
        Never use plain `clang` for the `afl` / `cmplog` variants.

        Use the `shell_exec` tool from local_shell to:

          1. Inspect the top-level files (`ls`, `cat README.md`, `cat configure.ac`,
             `cat CMakeLists.txt`, etc.).
          2. For each variant, configure and build out of tree in a directory
             whose path differs ONLY in the variant name, e.g.
             `<repo root>/build-afl`, `<repo root>/build-cmplog`,
             `<repo root>/build-cov`:
               - CMake: `cmake -S <repo root> -B <repo root>/build-<variant>
                 -DBUILD_SHARED_LIBS=OFF` (CMake ignores the `AR` / `RANLIB`
                 environment variables, so also pass
                 `-DCMAKE_AR=$(command -v llvm-ar) -DCMAKE_RANLIB=$(command -v llvm-ranlib)`
                 for `afl` / `cmplog`).
               - Meson: `meson setup <repo root>/build-<variant> --default-library=static`.
               - autotools: `../configure --disable-shared` from inside
                 `<repo root>/build-<variant>`.
               - In-tree-only builds (plain Makefile): copy the source tree per
                 variant (e.g. `<repo root>-afl`, `<repo root>-cmplog`,
                 `<repo root>-cov`) and build in each copy.
          3. Build the static library / object files for each variant.

        Tips from the AFL++ docs: always build static libraries; export
        `AFL_QUIET=1` so AFL++'s stderr output doesn't confuse configure
        checks; if `configure` rejects the AFL++ compiler, set `AFL_NOOPT=1`
        for the configure step only and unset it before `make`; pass
        `--disable-werror` (or equivalent) if warnings break the build.

        Once built, for each fuzz target previously stored, append to its `notes`
        (via `store_fuzz_target` again) the precise:

          - Header file(s) needed (`#include` lines).
          - Static library or `.o` files to link against (absolute paths).
          - Any `-I` include directories.
          - Any `-l` libraries or `-L` library directories.
          - Any required initialisation calls before the target function.
          - Any teardown/reset calls between iterations.

        In every path that points into a variant build directory, write the
        literal placeholder `{variant}` instead of `afl` / `cmplog` / `cov`,
        e.g. `<repo root>/build-{variant}/libfoo.a` or
        `-I<repo root>/build-{variant}/include`. `compile_harness` replaces it
        with the matching variant for each binary. Paths into the original
        source tree stay as they are.

        If any of the `afl`, `cmplog` or `cov` builds fails after a reasonable
        attempt, record what went wrong in the target notes and mark
        `input_kind` with the prefix `BUILD_FAILED:` so downstream steps can
        skip the target.

        Be autonomous. Make decisions, don't ask.
      toolboxes:
        - seclab_taskflows_fuzzing.toolboxes.fuzz_context
        - seclab_taskflows_fuzzing.toolboxes.local_shell
        - seclab_taskflows.toolboxes.local_file_viewer
